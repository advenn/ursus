name: ci

on:
  push:
    # Both, deliberately: this repository's default branch is master, and the
    # workflow triggered only on main — so CI had never run on a push. Listing
    # both keeps it working through a future rename instead of silently going
    # quiet again.
    branches: [main, master]
  pull_request:

env:
  # Mandatory: package `simd` does not compile without it.
  GOEXPERIMENT: simd
  GOAMD64: v3

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          check-latest: false
      - run: go build ./...
      - run: go vet ./...
      - name: import-level invariants
        run: go run ./internal/gen/levels

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Vector width is a RUNTIME property (GODEBUG=simd=N reselects it at
        # process start), so a single-width test run proves almost nothing.
        #
        #   512 — this hardware's native width; 8 float64 lanes == 1 bitmap byte,
        #         the coincidence that hides sub-byte bitmap bugs.
        #   256 — 4 lanes: catches ToArch() type assertions hardcoded to Mask64x8.
        #   128 — 2 lanes: bitmap writes straddle bytes. The width that finds
        #         accumulate-and-flush bugs in movemask packing.
        #     0 — software emulation, where ToArch() returns an unnameable
        #         simd/internal/bridge type. Exercises the scalar fallback path.
        width: ['512', '256', '128', '0']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'

      # ubuntu-latest is a MIX of hardware. Asking for a width the CPU does not
      # have is not a soft failure — package simd panics in its init:
      #
      #   panic: Requested GODEBUG=gosimd=512 is larger than the simd length
      #          (256) supported on this cpu
      #
      # so the 512 leg went red or green purely by which runner it drew. Skipping
      # rather than clamping is deliberate: clamping to 256 would run that width
      # twice and report it as 512 coverage, which is a worse lie than an honest
      # skip. All four widths still run locally via `make test-all`.
      - name: detect supported vector width
        id: simdcap
        run: |
          # `if` rather than `grep ... && have=256`: GitHub runs this under
          # bash -e, so a failing grep at the end of an && chain would fail the
          # step on exactly the runners this exists to protect.
          have=128
          if grep -qw avx2    /proc/cpuinfo; then have=256; fi
          if grep -qw avx512f /proc/cpuinfo; then have=512; fi
          want='${{ matrix.width }}'
          echo "runner supports up to ${have}-bit vectors"
          if [ "$want" = "0" ] || [ "$want" -le "$have" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=simd=$want skipped::this runner supports at most ${have}-bit vectors"
          fi

      - name: test (GODEBUG=simd=${{ matrix.width }})
        if: steps.simdcap.outputs.run == 'true'
        run: go test -count=1 ./...
        env:
          GODEBUG: simd=${{ matrix.width }}

  scalar-only:
    # Proves the library still builds and passes with the experiment off, i.e.
    # that the scalar twin of every kernel is real and reachable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
      - run: go test -count=1 ./...
        env:
          GOEXPERIMENT: ''

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
      - run: go test -race -count=1 ./...

  riskgate:
    # The arrow-go foundational claims. Allowed to be slow; must never be skipped.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
      - run: go test -run TestRiskGate -v ./internal/arrowx/

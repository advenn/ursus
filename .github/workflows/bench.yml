name: bench

# Correctness regression gate for the benchmark suite, not a performance gate.
#
# Timings from a shared GitHub runner are not worth recording — the machine is
# noisy, its core count varies, and this suite goes to some trouble elsewhere to
# make measurements comparable. What IS worth checking on a schedule is that
# every ported query still produces the right answer: 22 PDS-H queries across
# ursus, polars, pandas and duckdb, all validated against the duckdb reference.
# A change to the optimiser, a kernel or a join can break one of those without
# breaking a unit test.
#
# MANUAL DISPATCH ONLY, and that is deliberate rather than timid.
#
# This workflow had a nightly cron and had never executed once — `gh run list
# --workflow=bench.yml` returned nothing at all. A 45-minute four-engine job that
# has never been seen to pass is not something to schedule unattended; it would
# just mail a failure every morning until someone debugged it. Watch it pass by
# hand a few times, then put a schedule back if it earns one.
#
# It does not gate pull requests either way.

on:
  workflow_dispatch:
    inputs:
      scale:
        description: 'PDS-H scale factor'
        default: '0.1'
      engines:
        description: 'comma-separated engines (empty = all enabled)'
        default: 'ursus,polars,pandas,duckdb'

env:
  GOEXPERIMENT: simd
  # A COMPILE target requiring AVX2, so the binary would SIGILL on a CPU without
  # it — the same hardware-lottery class as the GODEBUG=simd=512 panic ci.yml
  # guards against. Left as-is because the runner that builds is the runner that
  # runs, and every current ubuntu-latest has AVX2. Noted so the next person does
  # not have to re-derive that.
  GOAMD64: v3

jobs:
  correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: bench
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          check-latest: false

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: setup
        run: make setup

      - name: generate SF${{ inputs.scale || '0.1' }}
        run: make gen SF=${{ inputs.scale || '0.1' }} FORCE=1

      - name: reference answers
        run: make answers SF=${{ inputs.scale || '0.1' }}

      # One iteration: this job asks whether the answers are right, not how
      # fast they arrive. FORCE=1 because the preflight gate is calibrated for
      # a machine someone is actually benchmarking on.
      - name: run
        run: |
          make run \
            SF=${{ inputs.scale || '0.1' }} \
            ENGINES=${{ inputs.engines || 'ursus,polars,pandas,duckdb' }} \
            ITERATIONS=1 FORCE=1

      - name: validate
        run: |
          make validate \
            SF=${{ inputs.scale || '0.1' }} \
            ENGINES=${{ inputs.engines || 'ursus,polars,pandas,duckdb' }}

      # continue-on-error because this runs even when `run` failed, and in that
      # case results/timings.csv may not exist — so `make report` fails too and
      # replaces an informative failure with a confusing one two steps later.
      - name: report
        if: always()
        continue-on-error: true
        run: make report

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: bench-results
          path: |
            bench/results/REPORT.md
            bench/results/timings.csv
            bench/results/validation.csv
            bench/results/dashboard.html
